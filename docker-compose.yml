services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hris-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hris-network

  mongodb:
    image: mongo:7-jammy
    container_name: hris-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hris-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hris-rabbitmq-consumer
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://guest:guest@hris-rabbitmq:5672
      MONGODB_URI: mongodb://hris-mongodb:27017/hris
    networks:
      - hris-network

volumes:
  mongo-data:

networks:
  hris-network:
    external: true